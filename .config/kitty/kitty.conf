# vim:fileencoding=utf-8:foldmethod=marker

#BEGIN_THEME
include ./theme.conf
# END_THEME

## Init with login shell to pick up env etc.
shell zsh --login

## enable scripting
allow_remote_control yes

# TODO: I set this in zshrc so gets overridden. Should change that
term xterm-kitty

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

modify_font cell_height 120%

disable_ligatures tab cursor
# END_KITTY_FONTS

window_margin_width 4
window_border_width 1
active_border_color #78997A
inactive_border_color #403A36

background_opacity 0.9
background_blur 20

# BEGIN TAB_BAR_STYLES
tab_title_template "{index} {title}"
# tab_bar_style custom
tab_bar_style powerline
tab_bar_edge top
# END_TAB_BAR_STYLES
#
macos_show_window_title_in none
macos_titlebar_color #292522
macos_menubar_title_max_length 0
window_padding_width 10

enabled_layouts splits,stack,tall,*

#startup_session ~/.config/kitty/session.conf
